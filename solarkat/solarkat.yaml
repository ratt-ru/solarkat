#!/usr/bin/env -S stimela run

_include:
  - solarkat-cabs.yaml

opts:
  log:
    dir: logs/log-{config.run.datetime}
    name: log-{info.fqname}
    nest: 2
    symlink: log
  backend:
    singularity:
      enable: true
    #select: native # If you want to run it natively use select:native backend

solarkat:
  name: solarkat recipe
  info: 'Recipe to Image and subtraction of the Sun from observations'

  assign:
    image-prefix: '{recipe.dir_out}/im{info.suffix}/im{info.suffix}{recipe.suffix}'
    mask-prefix: '{recipe.dir_out}/im{info.suffix}/mask{info.suffix}{recipe.suffix}'
    dirs:
      temp: ./tmp

  assign_based_on:
    _include: solarkat-observation-sets.yaml

  inputs:
    obs:
      dtype: str
      info: "Selects observation by label (a key under obs in solarkat-observation-sets.yaml)"
      required: true
    suffix:
      dtype: str
      default: ''
    dir_out:
      dtype: str
    ms:
      dtype: MS
    sun_radius_arcsec:
      dtype: Optional[float]
      info: "Radius of the Sun's clean-mask region in arcsec. If unset, a default for the observation's band is used."

  steps:
    image-1:
      info: "Auto-masked deep I clean"
      cab: wsclean
      params:
        ms: =recipe.ms
        nchan: 4
        mgain: 0.8
        size: 10000
        niter: 10000
        padding: 2.0
        column: DATA
        scale: 1.5asec
        auto-mask: 5
        auto-threshold: 3
        weight: 'briggs 0'
        join-channels: true 
        fit-spectral-pol: 4 
        temp-dir: =recipe.dirs.temp
        prefix: '{recipe.image-prefix}'

    mask-1:
      cab: breizorro
      info: 'Creating a fits mask with breizorro'
      params:
        threshold: 15
        outfile: '{previous.prefix}-mask.fits'
        restored-image: "{previous.prefix}-MFS-image.fits"
        outcatalog: None
        outregion: None


    image-2: 
      info: "Breizorro-masked deep I clean"
      cab: wsclean
      params:
        ms: =recipe.ms
        nchan: 4
        mgain: 0.8
        size: 10000
        niter: 100000
        padding: 2.0
        column: DATA
        scale: 1.5asec
        auto-threshold: 3
        weight: 'briggs 0'        
        join-channels: true
        fit-spectral-pol: 4 
        fits-mask: "{previous.outfile}"
        temp-dir: =recipe.dirs.temp
        prefix: '{recipe.image-prefix}'

    mask-2:
      cab: breizorro
      info: 'Creating a fits mask from the Breizorro-masked image'
      params:
        threshold: 15
        outfile: '{steps.image-2.prefix}-mask.fits'
        restored-image: "{steps.image-2.prefix}-MFS-image.fits"
        outcatalog: None
        outregion: None


    save-flags-1: 
      cab: casa.flagman
      info: 'Saving the flags after 1GC'
      params:
        ms: =recipe.ms
        versionname: 'before-selfcal.yml'
        mode: save


    selfcal-1:
      cab: quartical
      info: "Self-calibration"
      params:
        input_ms.path: =recipe.ms
        input_ms.time_chunk: '128'
        input_model.recipe: MODEL_DATA
        solver.terms: [K]
        solver.iter_recipe: [100]
        K.type: phase
        K.freq_interval: '0'
        K.time_interval: '4' 
        K.initial_estimate: true       
        K.direction_dependent: false
        output.overwrite: true
        output.products: [corrected_data]
        output.columns: [CORRECTED_DATA]

 
    save-flags-2: 
      cab: casa.flagman
      info: 'Saving flags after 2GC'
      params:
        ms: =recipe.ms
        versionname: "after-2GC.yml"
        mode:  save


    image-3: 
      info: "Breizorro-masked deep I clean"
      cab: wsclean
      params:
        ms: =recipe.ms        
        nchan: 4
        mgain: 0.8
        size:  10000
        niter: 100000
        padding: 2.0
        scale: 1.5asec                        
        auto-threshold: 3
        weight: 'briggs 0'
        join-channels: true
        fit-spectral-pol: 4
        column: CORRECTED_DATA
        temp-dir: =recipe.dirs.temp
        prefix: '{recipe.image-prefix}'
        fits-mask: "{steps.mask-2.outfile}"

    backup-model-data:
      cab: msutils.renamecol
      info: 'Renaming the MODEL_DATA visibilities to ORIGINAL_MODEL_DATA (saving the MODEL_DATA of the original visibilities)'
      skip: false
      params:
        msname: =recipe.ms
        old-column: 'MODEL_DATA'
        new-column: 'MODEL_DATA_ORIGINAL'
 


    scan-numbers-extraction:
      info: 'Extract a list of unique scan numbers from a Measurement Set. The scan output parameter is a list of strings representing the unique scan numbers.'
      cab: extract_and_save_scan_numbers
      params:
        ms: =recipe.ms
        output_file: ='{recipe.dir_out}/scan-numbers.txt' 


    split-ms-by-scan:
      info: 'Load scan numbers extracted in the previous step and Split the MS into scans using as input the scan_numbers'
      recipe:
        steps:
          load-scan-numbers:
            cab: load_scan_numbers
            params:
              scans_file: =root.steps.scan-numbers-extraction.output_file
          split-ms:
            params:
              scan_list: =steps.load-scan-numbers.scan_numbers
            recipe:
              inputs:
                scan_list:
                  dtype: List[str]
              for_loop:
                var: scan
                over: scan_list
              steps:
                casa_split_scan:
                  cab: splitms_scan
                  params:
                    vis: '{root.ms}'
                    datacolumn: 'all'
                    scan: '{recipe.scan}'
                    outputvis: ="{root.dir_out}" + "/" + "{root.perscan_dir_out}" + "/" + STRIPEXT(BASENAME(root.ms)) + "_scan_{recipe.scan}.ms"


    get-perscan-old-coords: 
      cab: get_old_coords
      info: 'Get the original phase centre of each scan, from the FIELD table of the original MS.'
      params: 
        ms: =recipe.ms
        output_file: '{recipe.dir_out}/old-perscans-coords.txt'


    get-sun-coordinates: 
      cab: sun_coordinates
      info: 'Determine the Sun coordinates (RA/DEC) for all scans in the MS and write into a txt file '
      params:
        ms: =recipe.ms
        output_file: '{recipe.dir_out}/sun-coordinates.txt'


    shift-to-sun: 
      info: 'Change the phase centre of each per-scan MS to the Sun (chgcentre cab from cult-cargo; rotates DATA, CORRECTED_DATA and MODEL_DATA).'
      recipe:
        steps:
          load-scan-numbers:
            cab: load_scan_numbers
            params:
              scans_file: =root.steps.scan-numbers-extraction.output_file
          rephase-scans:
            params:
              scan_list: =steps.load-scan-numbers.scan_numbers
              coords_file: =root.steps.get-sun-coordinates.output_file
            recipe:
              inputs:
                scan_list:
                  dtype: List[str]
                coords_file:
                  dtype: File
              for_loop:
                var: scan
                over: scan_list
              steps:
                get-coords:
                  cab: get_scan_coords
                  params:
                    coords_file: =recipe.coords_file
                    scan: =recipe.scan
                chgcentre:
                  cab: chgcentre
                  params:
                    ms: ="{root.dir_out}/{root.perscan_dir_out}/" + STRIPEXT(BASENAME(root.ms)) + "_scan_{recipe.scan}.ms"
                    ra: =steps.get-coords.ra
                    dec: =steps.get-coords.dec

    image-sun:
      info: "Create a dirty image of the Sun's field for each scan"
      params:
        ms_list: =GLOB("{recipe.dir_out}/{recipe.perscan_dir_out}/*_scan_*.ms")  
      recipe:
        inputs:
          ms_list:
            dtype: List[MS]
        for_loop:
          var: ms
          over: ms_list
        steps:
          image:
            cab: wsclean
            params: 
              niter: 0
              nchan: 4
              size: 6000
              scale: 1.5asec 
              ms: =recipe.ms
              column: CORRECTED_DATA
              temp-dir: =root.dirs.temp
              prefix: ="{root.dir_out}/{root.perscan_dir_out}/{root.sun_images_dir}/" + STRIPEXT(BASENAME(recipe.ms))


    create-ds9-regions:
      cab: create_ds9_regions
      info: 'Create ds9 regions for each Sun image.'
      params:
        input_file: =steps.get-sun-coordinates.output_file
        output_dir: '{recipe.dir_out}/{recipe.regions_dir_out}'
        band: '{recipe.band}'
        radius_arcsec: =IFSET(recipe.sun_radius_arcsec)


    make-mask:      
      info: 'Sun Fits-mask creation in each scan with breizorro'
      recipe:
        inputs:
          scan_list:
            dtype: List[str]
        steps:
          load-scan-numbers:
            cab: load_scan_numbers
            params:
              scans_file: =root.steps.scan-numbers-extraction.output_file  
          making_masks:
            params:
              scan_list: =steps.load-scan-numbers.scan_numbers
            recipe:
              inputs:
                scan_list:
                  dtype: List[str]
              for_loop:
                var: scan
                over: scan_list
              steps:
                make_mask:
                  cab: breizorro
                  params:
                    restored-image: ="{root.dir_out}/{root.perscan_dir_out}/{root.sun_images_dir}/" + STRIPEXT(BASENAME(root.ms)) + "_scan_{recipe.scan}-MFS-image.fits"
                    threshold: 999999999999
                    merge: ="{root.dir_out}" + "/" + "{root.regions_dir_out}" + "/" + "sun-region-{recipe.scan}.reg"
                    outfile: ="{root.dir_out}" + "/" + "{root.masks_dir_out}" + "/" + STRIPEXT(BASENAME(root.ms)) + "_scan_{recipe.scan}-mask.fits"
                    outcatalog: None
                    outregion: None



    deconvolve-sun:
      info: " clean imaging of the Sun for a better model, using the masks created from the make_mask step."
      params:
        ms_list:  =GLOB('{recipe.dir_out}/{recipe.perscan_dir_out}/*_scan_*.ms')
      recipe:
        inputs:
          ms_list:
            dtype: List[MS]
        for_loop:
          var: ms
          over: ms_list
        steps:
          image:
            cab: wsclean
            params:              
              nchan: 4
              size:  6000
              niter: 100000
              ms: =recipe.ms
              scale: 1.5asec               
              multiscale: true 
              auto-threshold: 1
              join-channels: true
              fit-spectral-pol: 4
              save-source-list: true  
              column: CORRECTED_DATA 
              temp-dir: =root.dirs.temp
              prefix: ="{root.dir_out}/{root.perscan_dir_out}/{root.clean_image_sun}/" + STRIPEXT(BASENAME(recipe.ms))
              fits-mask: ="{root.dir_out}" + "/" + "{root.masks_dir_out}" + "/" + STRIPEXT(BASENAME(recipe.ms)) + "-mask.fits"



    predict-sun-model:
      info: " Predict Sun Model to the MODEL_DATA column."     
      params: 
        ms_list: =GLOB("{recipe.dir_out}/{recipe.perscan_dir_out}/*_scan_*.ms")
      recipe:
        inputs:
          ms_list:
            dtype: List[MS]
        for_loop:
          var: ms 
          over: ms_list
        steps:
          predict:
            cab: wsclean        
            params:
              nchan: 4
              size:   6000
              ms: =recipe.ms
              scale: 1.5asec
              predict: true
              temp-dir: =root.dirs.temp
              prefix: ="{root.dir_out}/{root.perscan_dir_out}/{root.clean_image_sun}/" + STRIPEXT(BASENAME(recipe.ms)) 

    rephase:
      info: 'Rephase each per-scan MS back to its original phase centre.'
      recipe:
        steps:
          load-scan-numbers:
            cab: load_scan_numbers
            params:
              scans_file: =root.steps.scan-numbers-extraction.output_file
          rephase-scans:
            params:
              scan_list: =steps.load-scan-numbers.scan_numbers
              coords_file: =root.steps.get-perscan-old-coords.output_file
            recipe:
              inputs:
                scan_list:
                  dtype: List[str]
                coords_file:
                  dtype: File
              for_loop:
                var: scan
                over: scan_list
              steps:
                get-coords:
                  cab: get_scan_coords
                  params:
                    coords_file: =recipe.coords_file
                    scan: =recipe.scan
                chgcentre:
                  cab: chgcentre
                  params:
                    ms: ="{root.dir_out}/{root.perscan_dir_out}/" + STRIPEXT(BASENAME(root.ms)) + "_scan_{recipe.scan}.ms"
                    ra: =steps.get-coords.ra
                    dec: =steps.get-coords.dec



    add-model-data-columnn:
      cab: msutils.addcol
      info: "Add MODEL_DATA_SUN column to the original MS"
      params:
        msname:  =recipe.ms
        colname: 'MODEL_DATA_SUN'
        likecol: 'MODEL_DATA_ORIGINAL'


    copy-sun-model:
      cab: copy_scan_column_to_ms
      info: 'Copy MODEL_DATA of each per-scan MS (the Sun model, now at the original phase centre) into MODEL_DATA_SUN of the original MS'
      params:
        ms: =recipe.ms
        ms_list: =GLOB("{recipe.dir_out}/{recipe.perscan_dir_out}/*_scan_*.ms")
        fromcol: MODEL_DATA
        tocol: MODEL_DATA_SUN


    cal-and-peel-sun:
      cab: quartical
      info: 'Selfcal + peel sun'
      params:
        input_ms.path: =recipe.ms
        input_ms.is_bda: False
        input_ms.time_chunk: '14'
        input_ms.freq_chunk: '0'
        input_ms.select_uv_range: [0,0]
        input_ms.weight_column: WEIGHT_SPECTRUM
        input_ms.group_by: [FIELD_ID,DATA_DESC_ID,SCAN_NUMBER]
        input_model.recipe: MODEL_DATA_ORIGINAL:MODEL_DATA_SUN
        input_model.apply_p_jones: false
        solver.terms: [K,dE]
        solver.iter_recipe: [100,50]
        solver.propagate_flags: false
        solver.robust: false
        solver.threads: 4
        dask.threads: 8
        mad_flags.enable: false
        dask.scheduler: threads
        K.type: phase
        K.time_interval: 4
        K.freq_interval: 0
        K.initial_estimate: true
        K.direction_dependent: false
        dE.type: complex
        dE.time_interval: 14
        dE.freq_interval: 64
        dE.pinned_directions: [0]
        dE.initial_estimate: False
        dE.direction_dependent: true
        output.flags: true
        output.overwrite: true
        output.subtract_directions: [1]
        output.apply_p_jones_inv: false
        output.products: [corrected_residual]
        output.columns: [CORRECTED_RESIDUAL]
        output.log_directory: '{recipe.dir_out}/{recipe.qcal_output_dir}/'
        output.gain_directory: '{recipe.dir_out}/{recipe.qcal_output_dir}/peeled.qc'


    save-flags-3:
      cab: casa.flagman
      info: 'Saving flags after 3GC'
      params:
        ms: =recipe.ms
        versionname: "After-3GC.yml"
        mode: save


    image-4:
      info: "Deconvolve the improved image"
      cab: wsclean
      params:
        nchan: 4
        mgain: 0.8
        size:  10000
        padding: 2.0
        niter: 100000
        ms: =recipe.ms
        scale: 1.5asec
        auto-threshold: 3
        weight: 'briggs 0'
        join-channels: true
        fit-spectral-pol: 4
        column: CORRECTED_RESIDUAL
        temp-dir: =recipe.dirs.temp
        prefix: '{recipe.image-prefix}'
        fits-mask: "{steps.mask-2.outfile}"

