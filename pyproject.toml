[tool.poetry]
name = "solarkat"
version = "1.1.0"
description = "Solar imaging pipeline for solar interference mitigation in MeerKAT data."
authors = ["Victória da Graça G. Samboco <vicky.samboco@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ratt-ru/solarkat.git"
documentation = "https://solarkat-docs.readthedocs.io/en/latest/"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy"
]
include = [
    "solarkat/solarkat.yaml",
    "solarkat/solarkat-cabs.yaml",
    "solarkat/solarkat-observation-sets.yaml", 
    "solarkat/solarkat.py" 
]

[tool.poetry.dependencies]
python = ">=3.9,<3.14"
stimela = "^2.1.4"
# cult-cargo pins the tool images (quay.io/stimela2/*:cc<version>), so keep it
# on one minor series for reproducible runs.
cult-cargo = "~0.2.1"
python-casacore = ">=3.5"
astropy = ">=5.0"
numpy = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

